name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: pytest + ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff check src tests
          pytest -q
      - name: validate policy files
        run: pst-gate validate --policy security/policy.yml --exceptions security/exceptions.yml --baseline security/baseline.json
      - name: BYO-SARIF example
        run: |
          pst-gate decide \
            --sarif-dir examples/byo-sarif/reports \
            --baseline examples/byo-sarif/security/baseline.json \
            --exceptions examples/byo-sarif/security/exceptions.yml \
            --policy examples/byo-sarif/security/policy.yml \
            --scan-root examples/byo-sarif \
            --out-dir out/byo
      - name: triage new-high (expect fail)
        run: |
          set +e
          pst-gate decide \
            --sarif-dir examples/triage/new-high/reports \
            --baseline examples/triage/new-high/security/baseline.json \
            --exceptions examples/triage/new-high/security/exceptions.yml \
            --policy examples/triage/new-high/security/policy.yml \
            --codeowners examples/triage/new-high/CODEOWNERS \
            --scan-root examples/triage/new-high \
            --out-dir out/triage-new-high \
            --today 2026-09-28
          exit_code=$?
          set -e
          test "$exit_code" -eq 1
      - name: triage in-baseline (expect pass)
        run: |
          pst-gate decide \
            --sarif-dir examples/triage/in-baseline/reports \
            --baseline examples/triage/in-baseline/security/baseline.json \
            --exceptions examples/triage/in-baseline/security/exceptions.yml \
            --policy examples/triage/in-baseline/security/policy.yml \
            --codeowners examples/triage/in-baseline/CODEOWNERS \
            --scan-root examples/triage/in-baseline \
            --out-dir out/triage-in-baseline \
            --today 2026-09-28
      - name: triage kev-in-baseline (expect fail)
        run: |
          set +e
          pst-gate decide \
            --sarif-dir examples/triage/kev-in-baseline/reports \
            --baseline examples/triage/kev-in-baseline/security/baseline.json \
            --exceptions examples/triage/kev-in-baseline/security/exceptions.yml \
            --policy examples/triage/kev-in-baseline/security/policy.yml \
            --codeowners examples/triage/kev-in-baseline/CODEOWNERS \
            --scan-root examples/triage/kev-in-baseline \
            --kev examples/triage/kev-in-baseline/kev.json \
            --out-dir out/triage-kev \
            --today 2026-09-28
          exit_code=$?
          set -e
          test "$exit_code" -eq 1
      - name: consumer unit tests
        working-directory: examples/consumer
        run: PYTHONPATH=app pytest -q tests

  example-app:
    uses: ./.github/workflows/gate.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      actions: read
    with:
      install-from-workspace: true
      scan-path: examples/consumer
      baseline-path: examples/consumer/security/baseline.json
      exceptions-path: examples/consumer/security/exceptions.yml
      policy-path: examples/consumer/security/policy.yml
      codeowners-path: examples/consumer/CODEOWNERS
      iac-path: infra
      fail-on: high
