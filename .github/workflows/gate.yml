name: pst-gate

on:
  workflow_call:
    inputs:
      scan-path:
        description: Directory to scan (repo-relative)
        type: string
        default: "."
      fail-on:
        type: string
        default: "high"
      baseline-path:
        type: string
        default: "security/baseline.json"
      exceptions-path:
        type: string
        default: "security/exceptions.yml"
      policy-path:
        type: string
        default: "security/policy.yml"
      codeowners-path:
        type: string
        default: "CODEOWNERS"
      iac-path:
        type: string
        default: "infra"
      gate-repo:
        type: string
        default: "VinaySobarad/pst-gate"
      gate-ref:
        type: string
        default: "v1"
      install-from-workspace:
        description: Caller repo is pst-gate (dogfood)
        type: boolean
        default: false
      scan-iac:
        type: boolean
        default: true
    secrets:
      SNYK_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: pst-gate-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decide:
    name: ship-or-dont
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      actions: read
    env:
      SCAN_PATH: ${{ inputs.scan-path }}
    steps:
      - name: Validate inputs
        run: |
          case "$SCAN_PATH" in
            *..*|*" "*) echo "scan-path must be a simple repo-relative directory"; exit 1 ;;
          esac

      - name: Checkout caller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout pst-gate
        if: ${{ !inputs.install-from-workspace }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.gate-repo }}
          ref: ${{ inputs.gate-ref }}
          path: .pst-gate

      - name: Workspace
        run: mkdir -p reports out

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Semgrep
        continue-on-error: true
        env:
          GATE_HOME: ${{ inputs.install-from-workspace && github.workspace || format('{0}/.pst-gate', github.workspace) }}
        working-directory: ${{ inputs.scan-path }}
        run: |
          python -m pip install semgrep
          extra_configs=()
          if [ -f "$GATE_HOME/rules/ai-sdlc.yml" ]; then
            extra_configs+=(--config "$GATE_HOME/rules/ai-sdlc.yml")
          fi
          if [ -d .semgrep ]; then
            extra_configs+=(--config .semgrep)
          fi
          semgrep scan --config p/owasp-top-ten --config p/python --config p/secrets \
            "${extra_configs[@]}" --sarif --output "$GITHUB_WORKSPACE/reports/semgrep.sarif" . || true

      - name: Trivy filesystem (SCA)
        continue-on-error: true
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.scan-path }}
          severity: CRITICAL,HIGH,MEDIUM
          format: sarif
          output: reports/trivy-fs.sarif
          exit-code: "0"

      - name: Trivy config (IaC)
        if: ${{ inputs.scan-iac }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.scan-path }}/${{ inputs.iac-path }}
          severity: CRITICAL,HIGH,MEDIUM
          format: sarif
          output: reports/trivy-iac.sarif
          exit-code: "0"

      - name: Gitleaks
        continue-on-error: true
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/${SCAN_PATH}:/src" \
            zricethezav/gitleaks:v8.21.2 detect \
            --source=/src --report-format sarif --report-path /src/gitleaks.sarif \
            --exit-code 0 --redact || true
          if [ -f "$GITHUB_WORKSPACE/${SCAN_PATH}/gitleaks.sarif" ]; then
            mv "$GITHUB_WORKSPACE/${SCAN_PATH}/gitleaks.sarif" reports/gitleaks.sarif
          fi

      - name: Snyk (optional)
        if: ${{ secrets.SNYK_TOKEN != '' }}
        continue-on-error: true
        working-directory: ${{ inputs.scan-path }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          npm install -g snyk
          snyk test --sarif-file-output="$GITHUB_WORKSPACE/reports/snyk.sarif" || true

      - name: SBOM (CycloneDX)
        continue-on-error: true
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.scan-path }}
          format: cyclonedx
          output: out/sbom.cdx.json
          exit-code: "0"

      - name: CISA KEV catalog
        continue-on-error: true
        run: |
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json" \
            -o reports/kev.json || true

      - name: Diff (AI-touch annotation)
        continue-on-error: true
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git diff "origin/${{ github.base_ref }}...HEAD" > reports/pr.diff || true
          else
            git diff HEAD~1 > reports/pr.diff || true
          fi

      - name: Decide (this repo)
        if: ${{ inputs.install-from-workspace }}
        id: gate-local
        uses: ./
        with:
          sarif-dir: reports
          baseline: ${{ inputs.baseline-path }}
          exceptions: ${{ inputs.exceptions-path }}
          policy: ${{ inputs.policy-path }}
          codeowners: ${{ inputs.codeowners-path }}
          scan-root: ${{ inputs.scan-path }}
          sbom: out/sbom.cdx.json
          kev: reports/kev.json
          diff: reports/pr.diff
          fail-on: ${{ inputs.fail-on }}
          out-dir: out
          fail-job: "false"

      - name: Decide (installed action)
        if: ${{ !inputs.install-from-workspace }}
        id: gate-remote
        uses: ./.pst-gate
        with:
          sarif-dir: reports
          baseline: ${{ inputs.baseline-path }}
          exceptions: ${{ inputs.exceptions-path }}
          policy: ${{ inputs.policy-path }}
          codeowners: ${{ inputs.codeowners-path }}
          scan-root: ${{ inputs.scan-path }}
          sbom: out/sbom.cdx.json
          kev: reports/kev.json
          diff: reports/pr.diff
          fail-on: ${{ inputs.fail-on }}
          out-dir: out
          fail-job: "false"

      - name: Job summary
        if: always()
        run: |
          if [ -f out/report.md ]; then
            cat out/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload SARIF (Security tab)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        with:
          sarif_file: out/merged.sarif
          category: pst-gate

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pst-gate-out
          path: |
            out/
            reports/

      - name: Fail job if gate failed
        if: always()
        env:
          LOCAL: ${{ steps.gate-local.outputs.verdict }}
          REMOTE: ${{ steps.gate-remote.outputs.verdict }}
        run: |
          verdict="${LOCAL:-$REMOTE}"
          if [ "$verdict" = "fail" ]; then
            echo "pst-gate verdict: fail"
            exit 1
          fi
          if [ -z "$verdict" ]; then
            echo "pst-gate produced no verdict"
            exit 1
          fi
          echo "pst-gate verdict: $verdict"
