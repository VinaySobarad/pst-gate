# Full pipeline (scanners + decide). Prefer uses: VinaySobarad/pst-gate@v1
# if you already produce SARIF — see examples/byo-sarif.

name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write
  actions: read

jobs:
  gate:
    uses: VinaySobarad/pst-gate/.github/workflows/gate.yml@v1
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    with:
      fail-on: high
      scan-path: .
