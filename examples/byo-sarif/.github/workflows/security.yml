# You already run Semgrep/Trivy. Only the decision step is reused.

name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: VinaySobarad/pst-gate@v1
        with:
          sarif-dir: reports
          fail-on: high
