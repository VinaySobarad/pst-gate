name: pst-gate
description: Ship/no-ship security gate for SARIF (baseline, exceptions, KEV, owners).
author: Vinay Sobarad
branding:
  icon: shield
  color: red

inputs:
  sarif-dir:
    description: Directory of *.sarif files
    required: true
    default: reports
  baseline:
    default: security/baseline.json
  exceptions:
    default: security/exceptions.yml
  policy:
    default: security/policy.yml
  codeowners:
    default: CODEOWNERS
  scan-root:
    default: "."
  sbom:
    description: CycloneDX JSON (optional)
    required: false
    default: ""
  kev:
    description: CISA KEV JSON (optional)
    required: false
    default: ""
  diff:
    description: Unified diff for AI-touch annotation
    required: false
    default: ""
  fail-on:
    default: "high"
  out-dir:
    default: out
  comment-pr:
    description: Upsert a sticky PR comment
    default: "true"
  github-token:
    default: ${{ github.token }}
  fail-job:
    description: Fail this step when the verdict is fail
    default: "true"

outputs:
  verdict:
    description: pass or fail
    value: ${{ steps.decide.outputs.verdict }}
  blocking-count:
    description: Number of blocking findings
    value: ${{ steps.decide.outputs.blocking-count }}
  report-path:
    value: ${{ steps.decide.outputs.report-path }}
  exit-code:
    value: ${{ steps.decide.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install pst-gate
      shell: bash
      run: python -m pip install --upgrade pip && python -m pip install "${{ github.action_path }}"

    - name: Decide
      id: decide
      shell: bash
      env:
        SARIF_DIR: ${{ inputs.sarif-dir }}
        BASELINE: ${{ inputs.baseline }}
        EXCEPTIONS: ${{ inputs.exceptions }}
        POLICY: ${{ inputs.policy }}
        CODEOWNERS_PATH: ${{ inputs.codeowners }}
        SCAN_ROOT: ${{ inputs.scan-root }}
        SBOM: ${{ inputs.sbom }}
        KEV: ${{ inputs.kev }}
        DIFF: ${{ inputs.diff }}
        FAIL_ON: ${{ inputs.fail-on }}
        OUT_DIR: ${{ inputs.out-dir }}
      run: |
        set +e
        decide_args=()
        [ -n "$SBOM" ] && decide_args+=(--sbom "$SBOM")
        [ -n "$KEV" ] && decide_args+=(--kev "$KEV")
        [ -n "$DIFF" ] && decide_args+=(--diff "$DIFF")
        pst-gate decide \
          --sarif-dir "$SARIF_DIR" \
          --baseline "$BASELINE" \
          --exceptions "$EXCEPTIONS" \
          --policy "$POLICY" \
          --codeowners "$CODEOWNERS_PATH" \
          --scan-root "$SCAN_ROOT" \
          --out-dir "$OUT_DIR" \
          --fail-on "$FAIL_ON" \
          --github-output "$GITHUB_OUTPUT" \
          "${decide_args[@]}"
        echo "exit-code=$?" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Sticky PR comment
      if: ${{ github.event_name == 'pull_request' && inputs.comment-pr == 'true' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPORT: ${{ inputs.out-dir }}/report.md
      run: |
        if [ -f "$REPORT" ]; then
          pst-gate comment --report "$REPORT" || true
        fi

    - name: Fail job if blocking
      if: ${{ inputs.fail-job == 'true' && (steps.decide.outputs.verdict == 'fail' || steps.decide.outputs.exit-code == '2') }}
      shell: bash
      run: |
        echo "pst-gate verdict: ${{ steps.decide.outputs.verdict }}"
        exit 1
